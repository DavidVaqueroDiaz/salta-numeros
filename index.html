<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5ec8f0" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Salta Números</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- Barra superior durante el juego -->
    <div id="hud" class="hidden">
      <span id="hud-level" class="hud-badge">1</span>
      <span id="hud-timer">0.0 s</span>
      <span id="hud-coins" class="hidden">● 0/0</span>
      <span id="hud-power" class="hidden"></span>
      <button id="hud-exit" aria-label="Salir al menú">🏠</button>
    </div>

    <!-- Avisos breves (nuevas mecánicas, puntos de control) -->
    <div id="toast" class="hidden"></div>

    <!-- Controles táctiles -->
    <div id="controls" class="hidden">
      <div class="ctl-pair">
        <div id="ctl-left" class="ctl" aria-label="Izquierda">◀</div>
        <div id="ctl-right" class="ctl" aria-label="Derecha">▶</div>
      </div>
      <div id="ctl-jump" class="ctl" aria-label="Saltar">⬆</div>
    </div>

    <!-- Puerta matemática (lo rellena mathDoor.ts) -->
    <div id="door-modal" class="overlay hidden"></div>

    <!-- Menú principal / selector de niveles (lo rellena screens.ts) -->
    <div id="screen-menu" class="overlay"></div>

    <!-- Resultados de nivel (lo rellena screens.ts) -->
    <div id="screen-results" class="overlay hidden"></div>

    <!-- Aviso si la tablet está en vertical -->
    <div id="rotate-hint"><span>🔄</span>Gira la tablet para jugar</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
